<!doctype html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title">Salud global · Panel de datos</title>
  <meta name="description" data-i18n-attr="content:desc" content="Casos, muertes y evolución diaria de COVID-19 por país, con datos abiertos.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <header class="container py-3 d-flex justify-content-between align-items-center">
    <h1 class="h5 m-0 fw-semibold" data-i18n="h1">Salud global · Panel de datos</h1>
    <div class="d-flex gap-2"><button id="langBtn" class="btn btn-sm btn-outline-secondary" type="button">EN</button><button id="themeBtn" class="btn btn-sm btn-outline-secondary" type="button" data-i18n="theme" data-i18n-attr="aria-label:themeAria">Tema</button></div>
  </header>

  <main class="container pb-5">
    <div id="error" class="alert alert-danger d-none" role="alert"></div>

    <section id="totals" class="row g-0 stats mb-4" data-i18n-attr="aria-label:totals" aria-label="Totales">
      <div class="col-6 col-md-4 stat"><span class="label" data-i18n="cases">Casos</span><span id="kCases" class="num">–</span><span id="kCasesToday" class="sub"></span></div>
      <div class="col-6 col-md-4 stat"><span class="label" data-i18n="deaths">Muertes</span><span id="kDeaths" class="num death">–</span><span id="kDeathsToday" class="sub"></span></div>
      <div class="col-6 col-md-4 stat"><span class="label" data-i18n="cfr">Letalidad</span><span id="kCfr" class="num">–</span><span class="sub" data-i18n="cfrSub">muertes / casos</span></div>
    </section>

    <section class="mb-4">
      <div class="d-flex flex-wrap gap-2 align-items-end mb-2">
        <div>
          <label for="causeSel" class="form-label small mb-1" data-i18n="cause">Causa</label>
          <select id="causeSel" class="form-select form-select-sm"></select>
        </div>
        <div>
          <label for="countrySel" class="form-label small mb-1" data-i18n="region">Región</label>
          <select id="countrySel" class="form-select form-select-sm"><option value="" data-i18n="world">Mundo</option></select>
        </div>
        <div>
          <label for="rangeSel" class="form-label small mb-1" data-i18n="period">Periodo</label>
          <select id="rangeSel" class="form-select form-select-sm">
            <option value="90" data-i18n="d90">90 días</option><option value="365" selected data-i18n="y1">1 año</option>
            <option value="730" data-i18n="y2">2 años</option><option value="3650" data-i18n="all">Todo</option>
          </select>
        </div>
        <h2 id="chartTitle" class="h6 ms-md-auto m-0"></h2>
      </div>
      <div class="chart-wrap"><canvas id="chart" role="img" data-i18n-attr="aria-label:chartAria" aria-label="Gráfica de casos nuevos por día"></canvas></div>
    </section>

    <section>
      <div class="d-flex justify-content-between align-items-center mb-2 gap-2">
        <h2 class="h6 m-0" data-i18n="countries">Países</h2>
        <input id="search" type="search" class="form-control form-control-sm" data-i18n-attr="placeholder:search;aria-label:search" placeholder="Buscar país" aria-label="Buscar país">
      </div>
      <div class="table-responsive tbl">
        <table class="table table-sm table-hover align-middle mb-0">
          <thead id="thead"><tr>
            <th data-k="country" scope="col" data-i18n="country">País</th>
            <th data-k="cases" class="text-end" scope="col" data-i18n="cases">Casos</th>
            <th data-k="deaths" class="text-end" scope="col" data-i18n="deaths">Muertes</th>
            <th data-k="per_million" class="text-end" scope="col" data-i18n="perMillion">Casos / millón</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="container pb-4 small text-secondary">
    <span data-i18n="source">Fuente:</span> <a href="https://data.who.int/dashboards/covid19/data" rel="noopener">WHO COVID-19 Dashboard</a> · <a href="https://disease.sh" rel="noopener">disease.sh</a> (flags, population) · <a href="https://ourworldindata.org" rel="noopener">Our World in Data</a>. <span id="updated"></span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
